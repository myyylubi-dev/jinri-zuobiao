name: daily-brief

# 北京时间 07:10 / 11:10 / 18:10 各跑一次（GitHub 的 cron 是 UTC）
on:
  schedule:
    - cron: '10 23 * * *'
    - cron: '30 3 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成今日简报
        run: node src/build.mjs --ci

      - name: 提交快照（形成历史归档）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "brief: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
